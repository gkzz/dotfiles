# Policy: use the hard minimum as the exact bootstrap version as well. Keeping
# both roles coupled gives local and CI setup a single version source of truth.
min_version = "2026.8.15"

[settings]
# 新しいバージョンの解決時に、公開から14日未満のリリースを除外し、
# リリース直後の不具合やサプライチェーンリスクを軽減する。
# 完全固定バージョンや mise.lock に記録済みのバージョンには適用されない。
minimum_release_age = "14d"

[env]
# Resolve the repository from this config file so `mise install` works before
# the managed global config symlink exists.
DOTFILES = "{{ config_source | canonicalize | dirname }}"

[tools]
biome = "2.5.14"
node = "24.21.0"
python = "3.15.0"
go = "1.27.2"
java = "27.0.0"
pnpm = "12.11.1"
ghq = "1.11.2"
peco = "0.6.0"
direnv = "2.38.1"

[bootstrap.packages]
"brew:git" = "latest"

[dotfiles]
"~/.dotfiles" = { source = ".", mode = "symlink" }
"~/.bashrc" = { source = ".bashrc", mode = "symlink" }
"~/.bash_profile" = { source = ".bash_profile", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
