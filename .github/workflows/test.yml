name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-checks:
    name: Lifecycle safety checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: ./.github/actions/setup-mise
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install-node: "true"

      - name: Verify command help output
        run: |
          make help
          ./bin/dotfiles --help
          ./setup/gcm.sh --help
          ./setup/mise-install.sh --help

      - name: Run lifecycle safety checks
        run: make ci

      - name: Dry-run mise bootstrap
        run: ./setup/mise-install.sh --dry-run
