name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotfiles-smoke:
    name: Dotfiles integration tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository toolchain
        uses: ./.github/actions/setup-mise
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install-node: "true"

      - name: Verify command help output
        run: |
          make help
          ./bin/dotfiles --help
          ./setup/gcm.sh --help
          ./setup/mise-install.sh --help

      - name: Run lifecycle tests
        run: make test SKIP_MISE_ISOLATION=1

      - name: Dry-run mise bootstrap
        run: ./setup/mise-install.sh --dry-run

  mise-isolation:
    name: Mise config isolation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise CLI
        uses: ./.github/actions/setup-mise

      - name: Print mise version
        run: mise --version

      - name: Reject caller and HOME mise configuration
        run: ./tests/integration/mise-isolation.sh

  setup-mise-caller:
    name: Setup mise for caller repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install caller repository toolchain
        uses: ./.github/actions/setup-mise
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install: "true"
          working-directory: tests/fixtures/setup-mise-caller

      - name: Verify caller repository toolchain
        working-directory: tests/fixtures/setup-mise-caller
        run: mise exec -- biome --version

  portability:
    name: Bash lifecycle portability (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository toolchain
        uses: ./.github/actions/setup-mise
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install-node: "true"

      - name: Run lifecycle tests
        run: make test SKIP_MISE_ISOLATION=1
