name: Dotfiles lifecycle E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Lifecycle E2E (${{ matrix.os }}, --skip-brew)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install snapshot toolchain
        uses: ./.github/actions/setup-mise
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          install-node: "true"
          cache-installs: "false"

      - name: Cache mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mise-cache
          key: ${{ runner.os }}-mise-${{ hashFiles('mise.lock') }}

      - name: Verify lifecycle in isolated HOME
        env:
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
        run: |
          node_directory="$(mise where node)/bin"
          export PATH="$node_directory:$PATH"
          ./tests/integration/lifecycle-e2e.sh
