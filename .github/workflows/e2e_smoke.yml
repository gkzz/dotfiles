name: E2E smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Lifecycle smoke (Homebrew disabled, with GitHub Actions default)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare test HOME directory
        run: |
          test_home="$RUNNER_TEMP/home"
          mkdir -p "$test_home"
          {
            printf 'HOME=%s\n' "$test_home"
            printf 'XDG_CONFIG_HOME=%s/.config\n' "$test_home"
            printf 'XDG_STATE_HOME=%s/.local/state\n' "$test_home"
          } >> "$GITHUB_ENV"

      - name: Verify lifecycle
        run: |
          if make check; then
            echo "error: initial check unexpectedly succeeded" >&2
            exit 1
          fi

          make install
          make install-apply

          make check

          make uninstall
          make uninstall-apply

          if make check; then
            echo "error: check unexpectedly succeeded after uninstall" >&2
            exit 1
          fi

          make install
          make install-apply
